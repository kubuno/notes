[module]
id           = "notes"
display_name = "Notes"
version      = "0.1.3"
description  = "Prises de notes Markdown, checklists, notebooks, liens bidirectionnels."
author       = "Kubuno Contributors"
license      = "AGPL-3.0"
homepage_url = "https://github.com/kubuno/kubuno"
runtime      = "rust"
dependencies = []
settings_path = "/notes/settings"

[process]
entrypoint = "kubuno-notes"
args       = []

[server]
host = "127.0.0.1"
port = 3104

[routes]
patterns = [
    { method = "*", path = "/*" },
]

[[sidebar_items]]
id       = "notes"
label    = "Notes"
icon     = "StickyNote"
path     = "/notes"
position = 30
protected_folder = "Notes"
section  = "main"

[[sidebar_items]]
id       = "notes-notebooks"
label    = "Notebooks"
icon     = "BookOpen"
path     = "/notes/notebooks"
launchable = false
position = 31
section  = "main"

[[sidebar_items]]
id       = "notes-archive"
label    = "Archivées"
icon     = "Archive"
path     = "/notes/archive"
launchable = false
position = 32
section  = "main"

[[sidebar_items]]
id       = "notes-trash"
label    = "Corbeille"
icon     = "Trash2"
path     = "/notes/trash"
launchable = false
position = 97
section  = "secondary"

[events]
subscribed = [
    "UserDeleted",
    "TaskCompleted",
    "EventCreated",
]
publishes = [
    "NoteCreated",
]

# ── Déclaration des paramètres (architecture module-settings du core) ─────────
# Poussés au core à l'enregistrement (settings_schema) : les réglages globaux se
# gèrent dans la console d'administration (Modules → Notes → réglages).

[[settings]]
key     = "default_editor"
scope   = "global"
type    = "enum"
default = "wysiwyg"
label   = "Mode éditeur par défaut"
description = "Éditeur proposé à l'ouverture d'une nouvelle note."
values  = [
    { value = "wysiwyg",  label = "Éditeur visuel (WYSIWYG)" },
    { value = "markdown", label = "Markdown" },
]

[[settings]]
key     = "autosave_interval_s"
scope   = "global"
type    = "int"
default = 30
label   = "Intervalle auto-save (secondes)"
description = "0 pour désactiver l'enregistrement automatique."

[[settings]]
key     = "enable_spell_check"
scope   = "global"
type    = "bool"
default = true
label   = "Correcteur orthographique actif"

[[settings]]
key     = "enable_bidirectional_links"
scope   = "global"
type    = "bool"
default = true
label   = "Liens bidirectionnels actifs"

[[settings]]
key     = "default_reminder_before_min"
scope   = "global"
type    = "int"
default = 60
label   = "Rappel par défaut avant échéance (min)"
